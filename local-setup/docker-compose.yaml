name: livekit-agent-ecosystem

x-runtime: &runtime
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - lab

x-python: &python
  <<: *runtime
  image: livekit-agent-ecosystem-python:local
  build:
    context: ..
    dockerfile: local-setup/docker/python.Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:?Pinned images.env is required}
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=64m,mode=1777
  pids_limit: 256
  stop_grace_period: 25s

services:
  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?Pinned images.env is required}
    user: "999:999"
    environment:
      POSTGRES_DB: livekit_lab
      POSTGRES_USER: livekit_lab_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run local setup init}
      APP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local setup init}
      MIGRATION_POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Run local setup init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=32, -c, shared_buffers=64MB, -c, work_mem=4MB]
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/010-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
      - ./config/020-migration-role.sh:/etc/continuity/prepare-postgres.sh:ro
    tmpfs:
      - /var/run/postgresql:rw,nosuid,noexec,size=8m,uid=999,gid=999
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U livekit_lab_admin -d livekit_lab']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

  livekit:
    <<: *runtime
    image: ${LIVEKIT_IMAGE:?Pinned images.env is required}
    user: "10001:10001"
    command: [--config, /etc/livekit/livekit.yaml]
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?Run init}: ${LIVEKIT_API_SECRET:?Run init}'
    volumes:
      - ./.generated/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_HTTP_PORT:-17880}:7880
      - ${BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_TCP_PORT:-17881}:${LIVEKIT_TCP_PORT:-17881}/tcp
      - ${BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_UDP_PORT:-17882}:${LIVEKIT_UDP_PORT:-17882}/udp
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    healthcheck:
      test: [CMD, wget, -q, -O, '-', http://127.0.0.1:7880/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s

  control-api:
    <<: *python
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:${LIVEKIT_HTTP_PORT:-17880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Run init}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Run init}
      LOCAL_ACCESS_TOKEN: ${LOCAL_ACCESS_TOKEN:?Run init}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: livekit_lab
      POSTGRES_USER: livekit_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init}
      P1_POSTGRES_HOST: postgres
      P1_POSTGRES_PORT: "5432"
      P1_POSTGRES_DB: livekit_lab
      P1_POSTGRES_USER: livekit_lab
      P1_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init}
      P1_POSTGRES_SCHEMA: ${P1_WORKER_SCHEMA:-continuity}
      P1_BUSINESS_ENABLED: ${P1_BUSINESS_ENABLED:-0}
      P1_CONVERSATION_INFERENCE: ${P1_CONVERSATION_INFERENCE:-scripted}
      P1_WORKER_SCOPE: ${P1_WORKER_SCOPE:-demo-traveller}
      P1_BUSINESS_SUPPLIER_DB: /business/supplier.sqlite3
      P1_BUSINESS_SINK_DB: /business/completion.sqlite3
      P1_BUSINESS_WORKER_URL: http://conversation-agent:8082
      P1_TRACE_ENDPOINT: ${P1_TRACE_ENDPOINT:-}
      P1_TRACE_MODE: ${P1_TRACE_MODE:-scripted}
      INTAKE_DATABASE: /data/intake.sqlite3
    volumes:
      - application_data:/data
      - worker_data:/business:ro
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-18080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/readyz", timeout=3).read()']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    mem_limit: 384m
    cpus: 1.0

  p1-migrate:
    <<: *python
    profiles: [migrations]
    restart: "no"
    command: [python, -m, continuity_lab.postgres_cli, schema]
    environment:
      P1_MIGRATION_HOST: postgres
      P1_MIGRATION_PORT: "5432"
      P1_MIGRATION_DB: livekit_lab
      P1_MIGRATION_USER: continuity_migrator
      P1_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Run local setup init}
      P1_MIGRATION_SCHEMA: ${P1_WORKER_SCHEMA:-continuity}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  p1-worker:
    <<: *python
    profiles: [p1-workers]
    command: [python, -m, continuity_lab.worker_cli, run]
    environment:
      P1_POSTGRES_HOST: postgres
      P1_POSTGRES_PORT: "5432"
      P1_POSTGRES_DB: livekit_lab
      P1_POSTGRES_USER: livekit_lab
      P1_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local setup init}
      P1_POSTGRES_SCHEMA: ${P1_WORKER_SCHEMA:-continuity}
      P1_WORKER_SCOPE: ${P1_WORKER_SCOPE:-demo-traveller}
      P1_WORKER_SUPPLIER_DB: /data/supplier.sqlite3
      P1_WORKER_SINK_DB: /data/completion.sqlite3
      P1_WORKER_STATE_FILE: /tmp/p1-worker.json
      P1_TRACE_ENDPOINT: ${P1_TRACE_ENDPOINT:-}
      P1_TRACE_MODE: ${P1_TRACE_MODE:-scripted}
    volumes:
      - worker_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, continuity_lab.worker_cli, health]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 35s

  conversation-agent:
    <<: *python
    networks: [lab, inference]
    profiles: [p1-business]
    command: [python, -m, services.conversation_agent, start]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Run init}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Run init}
      LIVEKIT_AGENTS_PRELOAD_LOCAL_INFERENCE: "0"
      LIVEKIT_LOG_LEVEL: warn
      P1_CONVERSATION_INFERENCE: ${P1_CONVERSATION_INFERENCE:-scripted}
      P1_POSTGRES_HOST: postgres
      P1_POSTGRES_PORT: "5432"
      P1_POSTGRES_DB: livekit_lab
      P1_POSTGRES_USER: livekit_lab
      P1_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local setup init}
      P1_POSTGRES_SCHEMA: ${P1_WORKER_SCHEMA:-continuity}
      P1_WORKER_SCOPE: ${P1_WORKER_SCOPE:-demo-traveller}
      P1_TRACE_ENDPOINT: ${P1_TRACE_ENDPOINT:-}
      P1_TRACE_MODE: ${P1_TRACE_MODE:-scripted}
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8082/", timeout=3).read()']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 35s

  p1-llm:
    <<: *runtime
    profiles: [p1-models]
    image: ollama/ollama:0.40.15@sha256:55d6d58fce77338d8b626abbbbec63b79deeb24db3fd67b8a99951a84083552f
    user: "10001:10001"
    command: [serve]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models/ollama
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 60s
      HOME: /tmp
      TMPDIR: /tmp
    networks: [inference]
    read_only: true
    volumes:
      - type: bind
        source: ./.local/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 128
    stop_grace_period: 15s

  p1-stt:
    <<: *runtime
    profiles: [p1-models]
    image: livekit-agent-ecosystem-whisper:local
    build:
      context: ..
      dockerfile: local-setup/docker/whisper.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Pinned images.env is required}
    user: "10001:10001"
    networks: [inference]
    read_only: true
    volumes:
      - type: bind
        source: ./.local/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read(256)']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 1g
    cpus: 4.0
    pids_limit: 128
    stop_grace_period: 15s

  p1-tts:
    <<: *runtime
    profiles: [p1-models]
    image: livekit-agent-ecosystem-piper:local
    build:
      context: ..
      dockerfile: local-setup/docker/piper.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Pinned images.env is required}
    user: "10001:10001"
    networks: [inference]
    read_only: true
    volumes:
      - type: bind
        source: ./.local/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=2).read(256)']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 15s

  rtc-agent:
    <<: *python
    command: [python, -m, services.rtc_agent, start]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Run init}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Run init}
      LIVEKIT_AGENTS_PRELOAD_LOCAL_INFERENCE: "0"
      LIVEKIT_LOG_LEVEL: info
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/", timeout=3).read()']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.5

  console:
    <<: *runtime
    image: livekit-agent-ecosystem-console:local
    build:
      context: ..
      dockerfile: local-setup/docker/console.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Pinned images.env is required}
        NGINX_IMAGE: ${NGINX_IMAGE:?Pinned images.env is required}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-13000}:8080
    depends_on:
      control-api:
        condition: service_healthy
      rtc-agent:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    healthcheck:
      test: [CMD, wget, -q, -O, '-', http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  jaeger:
    <<: *runtime
    image: ${JAEGER_IMAGE:?Pinned images.env is required}
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_PORT:-26686}:16686
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

networks:
  lab:
    driver: bridge
  inference:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    labels:
      io.livekit-ecosystem.owner: ${LOCAL_STACK_OWNER:?Use the local stack manager}
  application_data:
    labels:
      io.livekit-ecosystem.owner: ${LOCAL_STACK_OWNER:?Use the local stack manager}
  worker_data:
    labels:
      io.livekit-ecosystem.owner: ${LOCAL_STACK_OWNER:?Use the local stack manager}
