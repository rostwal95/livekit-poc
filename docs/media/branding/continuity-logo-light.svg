<svg xmlns="http://www.w3.org/2000/svg" width="600" height="128" viewBox="0 0 600 128" role="img" aria-labelledby="title desc">
  <title id="title">Continuity Ecosystem for LiveKit Agents</title>
  <desc id="desc">Three linked nodes, for agent, channel and delegation continuity, around a voice waveform.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="0.5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <circle r="44" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <g stroke="#FFFFFF" stroke-width="5">
      <circle cx="0" cy="-44" r="11" fill="#0D9488"/>
      <circle cx="38.1" cy="22" r="11" fill="#0891B2"/>
      <circle cx="-38.1" cy="22" r="11" fill="#7C3AED"/>
    </g>
    <g stroke="#1F2328" stroke-width="5" stroke-linecap="round">
      <line x1="-15" y1="-7" x2="-15" y2="7"/>
      <line x1="-5" y1="-16" x2="-5" y2="16"/>
      <line x1="5" y1="-11" x2="5" y2="11"/>
      <line x1="15" y1="-5" x2="15" y2="5"/>
    </g>
  </g>
  <text x="140" y="66" fill="#1F2328" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">Continuity Ecosystem</text>
  <text x="142" y="98" fill="#59636E" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.4">RELIABLE VOICE AGENTS ON LIVEKIT</text>
</svg>
