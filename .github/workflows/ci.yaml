name: Foundation validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install frozen environment
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --all-extras --dev
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: Native runtime libraries
        run: apt-get update && apt-get install -y --no-install-recommends libstdc++6 libgomp1 make
      - name: Validate Python, architecture and documentation
        run: |
          make check
          make format-check
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: node:26.13.0-bookworm-slim@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm check && pnpm test && pnpm build
  local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [python, console]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated synthetic stack
        run: python3 local-setup/stack.py init
      - name: Start and probe actual services
        run: |
          python3 local-setup/stack.py doctor
          python3 local-setup/stack.py start
          python3 local-setup/stack.py smoke
          python3 local-setup/stack.py prepare-postgres
          python3 local-setup/stack.py migrate-postgres
      - name: Frozen host environment for the real PostgreSQL lane
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.14.10"
      - name: PostgreSQL contract and cutover gate
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --all-extras --dev
          make postgres-check
      - name: Installed effect and completion crash proof
        run: make phase-e-demo
      - name: Leased worker preserved-state restart proof
        run: make phase-f-demo
      - name: Pinned host Node for actual browser validation
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false
          package-manager-cache: false
      - name: Frozen browser workspace and pinned Chromium
        timeout-minutes: 4
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile
          pnpm --filter @livekit-ecosystem/local-console build
          pnpm --filter @livekit-ecosystem/local-console exec playwright install --with-deps chromium
      - name: Native browser, durable continuity and trace gate
        timeout-minutes: 8
        run: |
          .venv/bin/python - <<'PYTHON'
          import subprocess
          import sys
          from pathlib import Path

          resolver = (
              "import { chromium } from './apps/local-console/node_modules/@playwright/test/index.mjs'; "
              "process.stdout.write(chromium.executablePath());"
          )
          result = subprocess.run(
              ["node", "--input-type=module", "-e", resolver],
              check=True, capture_output=True, text=True, timeout=10,
          )
          browser = Path(result.stdout.strip())
          if not browser.is_absolute() or not browser.is_file() or "chromium-1254" not in browser.parts:
              raise RuntimeError("The pinned Playwright Chromium executable is unavailable")
          subprocess.run(
              [sys.executable, "local-setup/scripts/phase_g_demo.py", "--browser-executable", str(browser)],
              check=True, timeout=420,
          )
          PYTHON
      - name: Bounded diagnostics on failure
        if: failure()
        run: python3 local-setup/stack.py logs
      - name: Preserve-state shutdown
        if: always()
        run: python3 local-setup/stack.py stop --observability
