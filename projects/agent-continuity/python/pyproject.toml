[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-continuity"
version = "0.1.0"
description = "Typed durable inquiry and managed case boundaries for realtime applications"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.8", "prometheus-client==0.26.0"]
telemetry = [
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.scripts]
agent-continuity-inquiry = "continuity_lab.execution_cli:main"
agent-continuity-worker = "continuity_lab.worker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["continuity_lab*"]

[tool.setuptools.package-data]
continuity_lab = ["py.typed"]
